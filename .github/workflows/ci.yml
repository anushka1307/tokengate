name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Real Postgres for the database tests. Reachable only inside this job, so no password.
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tokengate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tokengate_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TOKENGATE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/tokengate_test
      TOKENGATE_REQUIRE_DB_TESTS: "1"  # fail, don't skip, if the database tests can't run
    steps:
      # Third-party actions are pinned to commit SHAs (tags can be moved); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Migrations run from the command line, twice
        env:
          TOKENGATE_DATABASE_URL: postgresql://postgres@localhost:5432/tokengate_test
        run: |
          uv run python -m app.db.migrate
          uv run python -m app.db.migrate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan the full history, not just the last commit
          persist-credentials: false

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact -v /repo

  attribution:
    # Commits and PR descriptions must not credit an AI assistant (see CLAUDE.md "Git").
    # On pull requests this blocks the merge; on main it also checks GitHub's own merge commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages and PR description
        env:
          # Passed via env, never interpolated into the script: PR text is untrusted input.
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          if [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="$HEAD_SHA -1"   # first push of a branch: check just the head commit
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          for sha in $(git rev-list $range); do
            git log -1 --format=%B "$sha" > "$dir/commit-$sha.txt"
          done
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            printf '%s\n' "$PR_BODY" > "$dir/pr-description.txt"
          fi
          echo "Checking $(ls "$dir" | wc -l) message(s)"
          scripts/check_attribution.sh "$dir"/*

  container:
    # Builds the real image (same platform as Cloud Run) and smoke-tests it. This is the only
    # place the image is built for now (no local Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_TOKEN: ci-only-metrics-token-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (linux/amd64, like Cloud Run)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t tokengate:ci .

      - name: Image facts (measured here, never hand-written)
        run: |
          size=$(docker image inspect tokengate:ci --format '{{.Size}}')
          user=$(docker image inspect tokengate:ci --format '{{.Config.User}}')
          {
            echo "### Container image"
            echo "- size: $((size / 1024 / 1024)) MiB ($size bytes)"
            echo "- runs as: $user"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$user" = "10001:10001" || { echo "image must not run as root"; exit 1; }

      - name: Start container (read-only filesystem)
        run: |
          # No database in this job yet, so run with auth off (local mode). Full auth in the
          # container is tested once Redis and Postgres services join this job (step 2.3).
          docker run -d --name tokengate --read-only -p 8080:8080 \
            -e TOKENGATE_ENV=local -e TOKENGATE_AUTH=disabled \
            -e TOKENGATE_METRICS_TOKEN="$METRICS_TOKEN" tokengate:ci

      - name: Wait for readiness
        run: |
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://localhost:8080/readyz && exit 0
            sleep 1
          done
          echo "container never became ready"; exit 1

      - name: Smoke test
        env:
          BASE_URL: http://localhost:8080
        run: scripts/smoke.sh

      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop --time 10 tokengate
          docker logs tokengate 2>&1 | grep -q '"shutdown_complete"' \
            || { echo "no clean shutdown logged"; exit 1; }

      - name: Container logs (on failure)
        if: failure()
        run: docker logs tokengate || true
