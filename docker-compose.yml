# Local stack. Phase 1: the gateway only. Redis and Postgres join in Phase 2.
#   docker compose up --build
#   curl localhost:8000/healthz
services:
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8080"
    environment:
      TOKENGATE_ENV: local  # the image defaults to prod; local keeps /metrics open for dev
    env_file:
      - path: .env
        required: false  # optional local overrides; never committed
    read_only: true  # the app writes nothing to disk
    security_opt:
      - no-new-privileges:true
